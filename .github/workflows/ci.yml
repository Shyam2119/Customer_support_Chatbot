name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Build demo data and keyword baseline
        run: python setup.py
      - name: Train and evaluate the intent classifier
        run: |
          python scripts/evaluate.py | tee eval.txt
          { echo '```'; head -4 eval.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Tests (include the accuracy gate)
        run: pytest -q
